    <script>
      function deleteBlog(button) {
        if (confirm("Are you sure you want to delete this blog?")) {
          button.closest(".blog-card").remove();
        }
      }

      function logout() {
        localStorage.removeItem("mk_admin_token");

        window.location.href = "login.html";
      }
    </script>
    <script>
      const BLOG_API = "http://localhost:8080/api/blogs";

      let allBlogs = [];
      let currentFilter = "all";

      async function loadBlogs() {
        const grid = document.getElementById("blogGrid");

        try {
          const response = await fetch(BLOG_API);

          if (!response.ok) {
            throw new Error("Failed to load blogs");
          }

          allBlogs = await response.json();

          updateCounts();
          populateCategories();
          displayBlogs();
        } catch (error) {
          console.error("Error loading blogs:", error);
          grid.innerHTML =
            "<p>Unable to load blogs. Check whether your Spring Boot backend is running.</p>";
        }
      }

      function updateCounts() {
        document.getElementById("allCount").textContent = allBlogs.length;

        document.getElementById("publishedCount").textContent = allBlogs.filter(
          (blog) => blog.published,
        ).length;

        document.getElementById("draftCount").textContent = allBlogs.filter(
          (blog) => !blog.published,
        ).length;
      }

      function populateCategories() {
        const select = document.getElementById("categoryFilter");
        const categories = [
          ...new Set(allBlogs.map((blog) => blog.category).filter(Boolean)),
        ];

        select.innerHTML = '<option value="all">All Categories</option>';

        categories.forEach((category) => {
          const option = document.createElement("option");
          option.value = category;
          option.textContent = category;
          select.appendChild(option);
        });
      }

      function displayBlogs() {
        const grid = document.getElementById("blogGrid");
        const selectedCategory =
          document.getElementById("categoryFilter").value;

        let filteredBlogs = allBlogs.filter((blog) => {
          if (currentFilter === "published" && !blog.published) {
            return false;
          }

          if (currentFilter === "draft" && blog.published) {
            return false;
          }

          if (
            selectedCategory !== "all" &&
            blog.category !== selectedCategory
          ) {
            return false;
          }

          return true;
        });

        if (filteredBlogs.length === 0) {
          grid.innerHTML = "<p>No blogs found.</p>";
          return;
        }

        grid.innerHTML = filteredBlogs
          .map((blog) => {
            const date = blog.createdAt
              ? new Date(blog.createdAt).toLocaleDateString("en-IN", {
                  day: "2-digit",
                  month: "short",
                  year: "numeric",
                })
              : "";

            const image = blog.imageUrl
              ? "http://localhost:8080" + blog.imageUrl
              : "";

            return `
        <article class="blog-card">
          ${
            image
              ? `<div class="blog-image">
                   <img
                     src="${image}"
                     alt="${escapeHTML(blog.title)}"
                     style="width:100%;height:100%;object-fit:cover;"
                   >
                 </div>`
              : `<div class="blog-image green-blog">🌱</div>`
          }

          <div class="blog-body">
            <div class="blog-meta">
              <span class="category">
                ${escapeHTML(blog.category || "General")}
              </span>
              <span>${date}</span>
            </div>

            <h3>${escapeHTML(blog.title || "Untitled Blog")}</h3>
             
            
            <h6>${escapeHTML(blog.shortDescription || "")}</h6>
            <p class="blog-short-description">
                   ${escapeHTML(blog.content || "")}
            </p>
            <a href="blog-details.html?id=${blog.id}&from=admin" class="read-more">
              Read More →
            </a>
            <div class="blog-footer">
              <span class="${blog.published ? "published-badge" : "draft-badge"}">
                ${blog.published ? "Published" : "Draft"}
              </span>

              <div>
                <a
                  href="AddBlog.html?id=${encodeURIComponent(blog.id)}"
                  class="edit-btn"
                >Edit</a>

                <button
                  class="delete-btn"
                  onclick="deleteBlog(${Number(blog.id)})"
                >Delete</button>
              </div>
            </div>
          </div>
        </article>
      `;
          })
          .join("");
      }

      function escapeHTML(value) {
        return String(value).replace(
          /[&<>"']/g,
          (character) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[character],
        );
      }

      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          currentFilter = button.dataset.filter;

          document.querySelectorAll("[data-filter]").forEach((item) => {
            item.classList.toggle("filter-active", item === button);
          });

          displayBlogs();
        });
      });

      document
        .getElementById("categoryFilter")
        .addEventListener("change", displayBlogs);

      async function deleteBlog(id) {
        if (
          !confirm("Are you sure you want to permanently delete this blog?")
        ) {
          return;
        }

        try {
          const response = await fetch(`${BLOG_API}/${id}`, {
            method: "DELETE",
          });

          if (!response.ok) {
            throw new Error("Delete failed");
          }

          allBlogs = allBlogs.filter((blog) => blog.id !== id);

          updateCounts();
          displayBlogs();
        } catch (error) {
          console.error("Error deleting blog:", error);
          alert("Could not delete the blog. Please check the backend.");
        }
      }

      // function logout() {
      //   localStorage.removeItem("mk_admin_token");
      //   window.location.href = "login.html";
      // }

      loadBlogs();
    </script>
